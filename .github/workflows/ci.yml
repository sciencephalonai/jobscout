# CI: run every quality gate on push / PR. Mirrors scripts/check.sh.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install . ruff mypy pytest

      - name: ruff
        run: ruff check backend/jobscout backend/tests
      - name: mypy
        run: mypy backend/jobscout
      - name: pytest
        run: pytest backend/tests -q   # from repo root so sources.yaml resolves

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: tsc + vite build
        run: |
          npm run --prefix frontend build
