version: "3.9"

services:
  weaviate:
    # 1.27.0 had broken offset pagination under range filters (pages overlapped
    # ~95% whenever a date filter was active) — fixed by the 1.27.x patches.
    image: semitechnologies/weaviate:1.27.27
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
      GRPC_PORT: "50051"

volumes:
  weaviate_data:
    driver: local
